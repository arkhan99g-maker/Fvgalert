name: XAUUSD FVG Alert

# Trigger: cron-job.org (GitHub API se) har ghante minute 2 par.
# GitHub ka apna schedule jaan boojh kar hata diya hai taake duplicate alerts na aayein.
on:
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send test Telegram message"
        required: false
        default: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run FVG check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
          TEST_MESSAGE: ${{ github.event.inputs.test_message }}
        run: python fvg_alert.py
