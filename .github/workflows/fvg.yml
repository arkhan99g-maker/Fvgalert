name: XAUUSD FVG Alert

# Trigger: cron-job.org (GitHub API se).
# 1h job: body {"ref":"main"}  -> timeframe default 1h
# 15m job: body {"ref":"main","inputs":{"timeframe":"15m"}}
on:
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send test Telegram message"
        required: false
        default: "false"
      timeframe:
        description: "1h or 15m"
        required: false
        default: "1h"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run FVG check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_API_KEY: ${{ secrets.TWELVE_API_KEY }}
          TEST_MESSAGE: ${{ github.event.inputs.test_message }}
          TIMEFRAME: ${{ github.event.inputs.timeframe }}
        run: python fvg_alert.py
